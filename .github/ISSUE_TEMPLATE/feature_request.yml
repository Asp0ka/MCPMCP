    id: goal
    attributes:
      label: 目标场景和当前限制
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 预期行为与验收标准
      description: 请注明版本、权限和副作用要求。
    validations:
      required: true
