plugins { id 'base'; id 'net.minecraftforge.gradle' version '6.0.54' apply false }
allprojects { group = 'dev.mcpmcp'; version = '0.1.0'; repositories { mavenCentral() } }
subprojects { apply plugin: 'java'; java { toolchain.languageVersion = JavaLanguageVersion.of(17) }; tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 } }
project(':core') { dependencies { implementation 'com.google.code.gson:gson:2.10.1' }; tasks.register('contractTest', JavaExec) { dependsOn testClasses; classpath = sourceSets.test.runtimeClasspath; mainClass = 'dev.mcpmcp.core.CoreTest' }; check.dependsOn contractTest }
project(':plugin-api') { apply plugin: 'java-library'; dependencies { api 'com.google.code.gson:gson:2.10.1' } }
